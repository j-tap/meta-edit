name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Cache TagLib
        uses: actions/cache@v4
        with:
          path: apps/macos/vendor/taglib
          key: taglib-${{ runner.os }}-${{ hashFiles('apps/macos/scripts/build-taglib.sh') }}
      - name: Build TagLib
        run: apps/macos/scripts/build-taglib.sh
      - name: Run tests
        run: apps/macos/scripts/test.sh
      - name: Build app and DMG
        run: |
          apps/macos/scripts/build-app.sh
          apps/macos/scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/macos/dist/*.dmg

  # Windows and Linux jobs are added when those apps land in apps/windows and apps/linux.

  release:
    name: Publish GitHub Release
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
