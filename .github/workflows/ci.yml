name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/macos-test
      - name: Build app
        run: apps/macos/scripts/build-app.sh
      - name: Zip app bundle
        working-directory: apps/macos/dist
        run: for bundle in *.app; do ditto -c -k --keepParent "$bundle" "${bundle%.app}-macos.zip"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/macos/dist/*-macos.zip
